    html.is-loading, html.is-loading body { overflow: hidden; }
    #preloader {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0c1017;
      transition: opacity .7s ease, visibility 0s linear .7s;
    }
    #preloader.is-done { opacity: 0; visibility: hidden; pointer-events: none; }

    #preloader .pl-logo {
      position: relative; width: min(260px, 62vw); aspect-ratio: 400 / 247;
      transition: transform .7s cubic-bezier(.2,.7,.2,1);
    }
    #preloader.is-done .pl-logo { transform: scale(1.06); }
    /* faint, empty logo */
    #preloader .pl-base {
      position: absolute; inset: 0; opacity: .16; filter: brightness(0) invert(1);
      background: var(--pl-logo) center / 100% 100% no-repeat;
    }
    /* water + coloured logo, visible only where the logo is */
    #preloader .pl-mask {
      position: absolute; inset: 0; overflow: hidden;
      -webkit-mask: var(--pl-logo) center / 100% 100% no-repeat;
              mask: var(--pl-logo) center / 100% 100% no-repeat;
    }
    /* Everything below animates with transform only, so it keeps moving while the main thread builds the 3D scene.
       .pl-water rises; .pl-color is counter-translated by the same distance so the logo itself stays put
       and is simply revealed from the bottom up. (water is 135% of the logo height: 1.35 x its % = the inverse) */
    #preloader .pl-water {
      position: absolute; left: 0; width: 100%; top: 0; height: 135%; overflow: hidden;
      transform: translateY(105%);
      animation: pl-fill 2s cubic-bezier(.4,.1,.3,1) forwards;
    }
    #preloader .pl-color {
      position: absolute; left: 0; width: 100%; height: 79.22%; top: -6.952%;
      background: var(--pl-logo) center / 100% 100% no-repeat;
      transform: translateY(-141.75%);
      animation: pl-fill-inv 2s cubic-bezier(.4,.1,.3,1) forwards;
    }
    #preloader.is-full .pl-water { animation: none; transform: translateY(-8%); transition: transform .4s cubic-bezier(.3,.6,.2,1); }
    #preloader.is-full .pl-color { animation: none; transform: translateY(10.8%); transition: transform .4s cubic-bezier(.3,.6,.2,1); }
    #preloader .pl-body { position: absolute; left: 0; right: 0; top: 6.5%; bottom: 0; overflow: hidden; }
    #preloader .pl-wave { position: absolute; top: 0; left: 0; width: 200%; height: 7%; animation: pl-slide 1.5s linear infinite; }
    #preloader .pl-wave.back { animation-duration: 2.4s; animation-direction: reverse; opacity: .5; }
    @keyframes pl-fill { from { transform: translateY(105%); } to { transform: translateY(24%); } }
    @keyframes pl-fill-inv { from { transform: translateY(-141.75%); } to { transform: translateY(-32.4%); } }
    @keyframes pl-slide { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    @media (prefers-reduced-motion: reduce) {
      #preloader .pl-water { animation: none; transform: translateY(40%); }
      #preloader .pl-color { animation: none; transform: translateY(-54%); }
      #preloader .pl-wave { animation: none; }
      #preloader .pl-logo { transition: none; }
    }
  </style>
</head>

<body>
  <!-- Preloader: the DPL Star logo filling with its brand colours while the 3D scene is built -->
  <div id="preloader" role="status" aria-live="polite" aria-label="Loading DPL Star">
    <div class="pl-logo" aria-hidden="true">
      <div class="pl-base"></div>
      <div class="pl-mask">
        <div class="pl-water">

          <svg class="pl-wave" viewBox="0 0 240 14" preserveAspectRatio="none"><path fill="#3493b8" d="M0 7 Q15 -1 30 7 T60 7 T90 7 T120 7 T150 7 T180 7 T210 7 T240 7 V14 H0 Z"/></svg>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

  <!-- Preloader controller: hide once the 3D scene has rendered its first frame -->
  <script>
    (function () {
      var el = document.getElementById('preloader');
      if (!el) return;
      var root = document.documentElement;
      root.classList.add('is-loading');

      var seen = false;
      try { seen = sessionStorage.getItem('dpl-seen') === '1'; } catch (e) {}
      var minShow = 2000;   // let the fill animation play at least this long
      var maxWait = 10000;               // never trap the user behind the loader
      var start = performance.now();
      var ready = false, finished = false;

      function finish() {
        if (finished) return;
        finished = true;
        el.classList.add('is-full');            // water tops up to the brim
        try { sessionStorage.setItem('dpl-seen', '1'); } catch (e) {}
        setTimeout(function () {                // hold the full logo for a beat, then reveal the site
          el.classList.add('is-done');
          root.classList.remove('is-loading');
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 1000);
        }, 400);
      }
      function check() {
        if (!ready) return;
        var wait = Math.max(0, minShow - (performance.now() - start));
        setTimeout(finish, wait);
      }

      window.addEventListener('dpl:scene-ready', function () {
        var fonts = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
        // don't wait on slow font networks for more than 1.2s
        Promise.race([fonts, new Promise(function (r) { setTimeout(r, 1200); })]).then(function () {
          ready = true; check();
        });
      }, { once: true });

      setTimeout(finish, maxWait);
    })();
  </script>
